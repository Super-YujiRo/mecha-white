<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>白球バトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="board">
    <div id="innTitle"><span id="inning">1回表</span></div>
    <table id="line"><thead><tr id="lineHead"></tr></thead><tbody><tr id="lineA"></tr><tr id="lineB"></tr></tbody></table>
  </div>
  <div id="count">
    <div class="row"><b>B</b><i></i><i></i><i></i></div>
    <div class="row"><b>S</b><i></i><i></i></div>
    <div class="row"><b>O</b><i></i><i></i></div>
  </div>
  <div id="bases"><i id="b2"></i><i id="b3"></i><i id="b1"></i></div>
  <div id="pitcherCard" class="card"><div class="role">投手</div><div class="name" id="pName"></div><div class="stats" id="pStats"></div><div id="stamina"><div></div></div></div>
  <div id="batterCard" class="card"><div class="role">打者</div><div class="name" id="bName"></div><div class="stats" id="bStats"></div></div>
  <div id="speed"></div>
  <div id="swingMode" class="hidden">ミート</div>
  <div id="pitchMenu"></div>
  <div id="help"></div>
  <div id="call"></div>
  <div id="change"></div>
  <div id="toast"></div>
</div>

<div id="title" class="screen">
  <div class="logo"><div class="l1">白球</div><div class="l2">バトル</div><div class="sub">BASEBALL BATTLE</div></div>
  <div class="menu">
    <button data-act="cpu" class="primary">CPUと対戦</button>
    <button data-act="host">友達を呼ぶ</button>
    <button data-act="join">友達の試合に参加</button>
  </div>
  <div class="opts">
    <label>イニング <select id="optInn"><option value="1">1回</option><option value="3" selected>3回</option><option value="5">5回</option><option value="9">9回</option></select></label>
    <label>CPUの強さ <select id="optLv"><option value="0">やさしい</option><option value="1" selected>ふつう</option><option value="2">つよい</option></select></label>
    <label>守備 <select id="optField"><option value="0" selected>手動</option><option value="1">オート</option></select></label>
    <label>打撃アシスト <select id="optAssist"><option value="lock" selected>ロックオン</option><option value="1">着弾点表示</option><option value="0">なし</option></select></label>
  </div>
  <div id="netBox" class="hidden"></div>
  <div class="foot">打撃：マウスでカーソル・左クリックで振る・右クリックでミート⇔強振　守備：WASDで移動・1〜4で送球</div>
</div>

<div id="loading" class="screen"><div class="spin"></div><div id="loadText">読み込み中…</div></div>
<div id="result" class="screen hidden"></div>

<script src="./vendor/peerjs.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
